[package]
name = "yarer"
version = "0.3.0"
description = "Yarer (Yet Another Rust Expression Resolver) is a library for resolving mathematical expressions. Internally it uses the shunting yard algorithm."
repository = "https://github.com/davassi/yarer"
homepage = "https://github.com/davassi/yarer"
license = "MIT OR Apache-2.0"
edition = "2021"
authors = ["Copyright © 2024–2025 Gianluigi Davassi <gianluigi.davassi@gmail.com>"]
categories = ["command-line-interface","algorithms","mathematics","parsing"]
readme = "README.md"
# The design specs and implementation plans under docs/superpowers/ are
# internal process artifacts — they are addressed to whoever implements a
# stage, not to anyone consuming the crate — and they are half the package by
# size. They stay in the repository. docs/tech-debt.md does ship: what a crate
# is known to be weak at is worth knowing before depending on it.
exclude = ["docs/superpowers/**", ".superpowers/**", ".idea/**"]
keywords = [
  "evaluator",
  "math",
  "parser",
  "expression",
  "resolver",
]

[dependencies]
clap = { version = "4.4.2", features = ["derive"] }
once_cell = "1.18.0"
regex = "1.9.3"
rustyline = "16.0.0"
log = "0.4"
env_logger = "0.11.2"
thiserror = "2.0.12"
lazy_static = "1.4"
dirs = "6.0.0"
num = "0.4.1"
num-bigint = "0.4.4"
num-traits = "0.2.18"
num-rational = "0.4"
bigdecimal = "0.4.2"
statrs = "0.18.0"

[profile.release]
opt-level = 3
debug = true

[[bin]]
name = "yarer"
path = "src/bin/main.rs"

[lib]
name = "yarer"



