[package]
name = "yarer"
version = "0.4.0"
description = "Yarer (Yet Another Rust Expression Resolver) is a library for resolving mathematical expressions. Internally it uses the shunting yard algorithm."
repository = "https://github.com/davassi/yarer"
homepage = "https://github.com/davassi/yarer"
license = "MIT OR Apache-2.0"
edition = "2021"
# The floor for the default feature set, which is the higher of the two this
# crate has. The library alone compiles on 1.86 — Vec::pop_if in the shunting
# yard is the newest thing it uses — and the extra two versions come from the
# CLI: rustyline 16 requires home ^0.5.12, which requires 1.88. Verified in CI
# at exactly this toolchain, because an unverified rust-version is a comment.
rust-version = "1.88"
authors = ["Copyright © 2024–2025 Gianluigi Davassi <gianluigi.davassi@gmail.com>"]
categories = ["command-line-interface","algorithms","mathematics","parsing"]
readme = "README.md"
# The design specs and implementation plans under docs/superpowers/ are
# internal process artifacts — they are addressed to whoever implements a
# stage, not to anyone consuming the crate — and they are half the package by
# size. They stay in the repository. docs/tech-debt.md does ship: what a crate
# is known to be weak at is worth knowing before depending on it.
exclude = ["docs/superpowers/**", ".superpowers/**", ".idea/**", "fuzz/**"]
keywords = [
  "evaluator",
  "math",
  "parser",
  "expression",
  "resolver",
]

[dependencies]
# The library. `log` is a facade the evaluator's own debug! calls need and
# pulls nothing, so it stays unconditional.
log = "0.4"
num = "0.4.1"
num-bigint = "0.4.4"
num-traits = "0.2.18"
num-rational = "0.4"
regex = "1.9.3"
statrs = "0.18.0"
thiserror = "2.0.12"

# The command-line binary only. Optional, so that a program using yarer as a
# library does not compile an argument parser, a line editor, and — through
# env_logger — jiff, a complete datetime library.
clap = { version = "4.4.2", features = ["derive"], optional = true }
rustyline = { version = "16.0.0", optional = true }
env_logger = { version = "0.11.2", optional = true }
dirs = { version = "6.0.0", optional = true }

[features]
# On by default so that `cargo install yarer` keeps working exactly as it did
# and no existing library user has to change anything. A program that only
# wants the evaluator opts out with `default-features = false`.
default = ["cli"]
cli = ["dep:clap", "dep:rustyline", "dep:env_logger", "dep:dirs"]

[profile.release]
opt-level = 3
debug = true

[[bin]]
name = "yarer"
path = "src/bin/main.rs"
required-features = ["cli"]

[lib]
name = "yarer"



